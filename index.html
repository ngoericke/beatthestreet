<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-transculent">
<meta name="apple-mobile-web-app-title" content="Beat the Street">
<meta name="theme-color" content="#14202b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Beat the Street</title>
<style>
    :root {
        --ink: #14202b;
        --paper: #f4f6f8;
        --line: #d5dce3;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    #map { position: fixed; inset: 0; width: 100%; height: 100%; }
    
    .bar {
        position: fixed; left: 0; right: 0; top: 0; z-index: 5;
        padding: calc(var(--safe-top) + 10px) 12px 10px;
        background: var(--ink);
        display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
    }
    .bar::-webkit-scrollbar { display: none; }
    .chip {
        flex: none; display: flex; align-items: center; gap: 8px;
        padding: 9px 14px; border-radius: 999px; border: 2px solid var(--c);
        background: transparent; color: #fff; font: 600 15px/1 inherit; font-family: inherit;
    }
    .chip i { width: 20px; height: 20px; display: grid; place-items: center; font-style: normal; font-size: 17px; line-height: 1; }
    .chip i img { width: 18px; height: 18px; }
    .chip[aria-pressed="false"] i { opacity: .55; }
    .chip[aria-pressed="true"] { background: var(--c); color: var(--t, #fff); }
    .chip:focus-visible, .fab:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    
    .fab {
        position: fixed; right: 14px; bottom: calc(var(--safe-bottom) + 24px); z-index: 5;
        width: 52px; height: 52px; border-radius: 50%; border: 0;
        background: var(--ink); color: #fff; display: grid; place-items: center;
        box-shadow: 0 2px 10px rgba(0,0,0,.35);
    }
    .fab[aria-pressed="true"] { background: #1f6feb; }
    .fab svg { width: 26px; height: 26px; }
    
    .info { font: 15px/1.4 -apple-system, "Segoe UI", sans-serif; color: var(--ink); max-width: 230px; }
    .info h2 { margin: 0 0 2px; font-size: 17px; }
    .info .cat { color: #5b6a78; margin-bottom: 6px; }
    .info a {
        display: inline-block; margin-top: 8px; padding: 9px 14px; border-radius: 8px;
        background: var(--ink); color: #fff; text-decoration: none; font-weight: 600;
    }
    
    .msg {
        position: fixed; inset: 0; z-index: 10; display: none; place-items: center; padding: 24px;
        background: var(--ink); color: #fff; text-align: center; line-height: 1.5;
    }
    .msg.show { display: grid; }
    .msg code { background: #24323f; padding: 2px 6px; border-radius: 4px; }
    #splash { position: fixed; inset: 0; z-index: 9; background: #000; display: grid; place-items: center; align-content: center; gap: 28px; transition: opacity .4s; }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: min(80vw, 360px); height: auto; }
    .sp-line { width: 120px; height: 6px; border-radius: 3px; background: repeating-linear-gradient(90deg, #f0922b 0 24px, transparent 24px 40px); background-size: 40px 6px; animation: sp-move .8s linear infinite; }
    @keyframes sp-move { to { background-position: 40px 0; } }
    .chip.refresh { --c: #5b6a78; position: sticky; right: 8px; margin-left: auto; padding: 9px 12px; background: var(--ink); box-shadow: -10px 0 10px 4px var(--ink), 10px 0 0 0 var(--ink); }
    .chip.refresh svg { width: 20px; height: 20px; display: block; }
    .info { max-width: 260px; position: relative; }
    .info h2 { padding-right: 30px; }
    .info .note { white-space: pre-line; overflow-wrap: anywhere; }
    .info .note a { display: inline; margin: 0; padding: 0; background: none; border-radius: 0; color: #1f6feb; font-weight: inherit; text-decoration: underline; }
    .info .x { position: absolute; top: 0; right: 0; width: 32px; height: 32px; border: 0; background: none; font-size: 26px; line-height: 1; color: #5b6a78; cursor: pointer; }
    .info .photos { display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 6px 0 8px; border-radius: 8px; }
    .info .photos::-webkit-scrollbar { display: none; }
    .info .photos a { flex: 0 0 100%; scroll-snap-align: center; display: block; margin: 0; padding: 0; background: none; border-radius: 0; }
    .info .photos img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; border-radius: 8px; background: #d5dce3; }
    .info .dots { display: flex; justify-content: center; gap: 5px; margin: -2px 0 6px; }
    .info .dots i { width: 6px; height: 6px; border-radius: 50%; background: #c3ccd5; }
    .info .dots i.on { background: #14202b; }
    #lightbox { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.94); display: flex; align-items: center; justify-content: center; }
    #lightbox[hidden] { display: none; }
    #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
    #lightbox .lb-x { position: absolute; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 14px; width: 48px; height: 48px; border: 0; border-radius: 50%; background: rgba(255,255,255,.18); color: #fff; font-size: 32px; line-height: 1; cursor: pointer; }
    .info { box-sizing: border-box; width: min(250px, 58vw); max-width: none; padding: 0 12px 14px 0; }
    .info .photos { width: 100%; }
    .gm-style .gm-style-iw-d { overflow-x: hidden !important; }
    html, body { display: flex; flex-direction: column; overflow: hidden; }
    .bar { order: -1; position: relative !important; top: auto !important; flex: none; }
    #map { position: relative !important; inset: auto !important; flex: 1 1 auto; width: 100%; height: auto !important; min-height: 0; }
    .bar { padding-top: calc(var(--safe-top) + 20px) !important; }
    #splash { background: #000 !important; }
    #splash img { width: min(72vw, 320px); }
    .sp-line { display: none; }
#splash { gap: 50px !important; }
#splash .sp-logo { width: min(78vw, 340px); }
#splash .sp-bus { width: min(72vw, 320px); }

#contact { position: fixed; inset: 0; z-index: 15; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
#contact[hidden], #pickHint[hidden] { display: none; }
.cf-card { position: relative; width: 100%; max-width: 440px; max-height: 92%; overflow-y: auto; background: #fff; color: var(--ink); border-radius: 16px 16px 0 0; padding: 20px 18px calc(var(--safe-bottom) + 18px); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
@media (min-width: 600px) { #contact { align-items: center; } .cf-card { border-radius: 16px; } }
.cf-card h2 { margin: 0 40px 12px 0; font-size: 19px; }
.cf-card label { display: block; margin: 0 0 12px; font-size: 13px; font-weight: 600; color: #5b6a78; }
.cf-card input, .cf-card select, .cf-card textarea { display: block; width: 100%; margin-top: 4px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 16px; line-height: 1.3; font-family: inherit; color: var(--ink); background: #fff; }
.cf-row { display: flex; gap: 8px; margin: -4px 0 12px; }
.cf-row button { flex: 1; padding: 10px; border: 1px solid var(--ink); border-radius: 10px; background: #fff; color: var(--ink); font-size: 14px; font-weight: 600; font-family: inherit; }
.cf-send { width: 100%; padding: 14px; border: 0; border-radius: 10px; background: var(--ink); color: #fff; font-size: 16px; font-weight: 600; font-family: inherit; }
.cf-x { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border: 0; background: none; font-size: 30px; line-height: 1; color: #5b6a78; }
.cf-err { margin: 0 0 10px; color: #c43535; font-size: 14px; }
.cf-err:empty { display: none; }
.cf-hint { margin: 10px 0 0; font-size: 13px; color: #5b6a78; }
#pickHint { position: fixed; left: 12px; right: 12px; bottom: calc(var(--safe-bottom) + 90px); z-index: 15; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; border-radius: 12px; background: var(--ink); color: #fff; font-size: 15px; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
#pickHint button { border: 1px solid #fff; background: none; color: #fff; border-radius: 8px; padding: 8px 12px; font-size: 14px; font-weight: 600; font-family: inherit; }
</style>
</head>
<body>
<div id="splash"><img class="sp-logo" src="icons/logo-text.png" alt="Beat the Street"><img class="sp-bus" src="icons/splash-bus.webp" alt=""><div class="sp-line"></div></div>
<div id="map"></div>
<div class="bar" id="filters" role="group" aria-label="Kategorien"></div>

<button class="fab" id="locate" aria-pressed="false" aria-label="Meinen Standort anzeigen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
  </svg>
</button>

<div id="lightbox" hidden><button class="lb-x" aria-label="Foto schließen">×</button><img id="lbImg" alt=""></div>  
<div id="contact" hidden>
  <div class="cf-card" role="dialog" aria-modal="true" aria-labelledby="cf-title">
    <button class="cf-x" id="cf-close" type="button" aria-label="Schließen">×</button>
    <h2 id="cf-title">Neuen Ort melden</h2>
    <label>Kategorie<select id="cf-cat"></select></label>
    <label>Name<input id="cf-name" type="text" autocomplete="off" placeholder="z. B. Betriebshof Nord"></label>
    <label>Adresse und Hinweise<textarea id="cf-note" rows="3" placeholder="Adresse, Telefon, Öffnungszeiten, Besonderheiten"></textarea></label>
    <label>Koordinaten<input id="cf-coords" type="text" autocomplete="off" placeholder="52.5069, 9.4631"></label>
    <div class="cf-row">
      <button type="button" id="cf-here">Mein Standort</button>
      <button type="button" id="cf-pick">Auf Karte tippen</button>
    </div>
    <label>Dein Name<input id="cf-from" type="text" autocomplete="name"></label>
    <p class="cf-err" id="cf-err" role="alert"></p>
    <button type="button" class="cf-send" id="cf-send">Mail vorbereiten</button>
    <p class="cf-hint">Es öffnet sich dein Mailprogramm mit fertigem Text. Fotos kannst du dort als Anhang hinzufügen.</p>
  </div>
</div>
<div id="pickHint" hidden><span>Tippe auf die gewünschte Stelle in der Karte</span><button type="button" id="pickCancel">Abbrechen</button></div>
<div class="msg" id="error"><div id="errorText"></div></div>

<script>
/* ====== EINSTELLUNGEN ====== */
const API_KEY   = "AIzaSyDSYDkgKG_ki-3Ro9htJ-O0E4D2xaOcGNA";
const START     = { lat: 52.5, lng: 9.4 }; // Kartenmitte beim Start
const START_ZOOM = 6;
const CONTACT_EMAIL = "n.goericke@gmail.com"; // Empfänger der Meldungen
/* =========================== */

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
const splashStart = Date.now();
function hideSplash() {
  const s = document.getElementById("splash");
  if (!s) return;
  setTimeout(() => {
    s.classList.add("hide");
    setTimeout(() => s.remove(), 500);
  }, Math.max(0, 2000 - (Date.now() - splashStart)));
}
setTimeout(hideSplash, 10000);
  
function showError(html) {
  document.getElementById("errorText").innerHTML = html;
  document.getElementById("error").classList.add("show");
}

// Google-Maps-Skript laden
(function load() {
  if (API_KEY === "DEIN_GOOGLE_MAPS_API_KEY") {
    showError("Bitte in <code>index.html</code> den Google-Maps-API-Key eintragen.");
    return;
  }
  const s = document.createElement("script");
  s.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&v=weekly&libraries=marker&loading=async&callback=initMap`;
  s.async = true;
  s.onerror = () => showError("Google Maps konnte nicht geladen werden.<br>Bitte Internetverbindung prüfen.");
  document.head.appendChild(s);
})();

let map, infoWindow, data, markers = [], active = new Set(), watchId = null, meMarker = null;
function linkify(el, text) {
  const re = /([\w.+-]+@[\w-]+(?:\.[\w-]+)+)|((?:https?:\/\/|www\.)[^\s<]+|[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|at|de|ch|eu|org|net|info|it|hu|cz|sk|si|hr)\b(?:\/[^\s<]*)?)|((?:\+|0)\d[\d\s\/().-]{6,}\d)/gi;
  let last = 0, m;
  while ((m = re.exec(text))) {
    let hit = m[0];
    const t = hit.match(/[.,;:!?)]+$/);
    if (t) hit = hit.slice(0, -t[0].length);
    el.append(text.slice(last, m.index));
    const a = document.createElement("a");
    a.textContent = hit;
    a.target = "_blank";
    a.rel = "noopener";
    a.href = m[1] ? "mailto:" + hit : m[3] ? "tel:" + hit.replace(/[^\d+]/g, "") : (/^https?:\/\//i.test(hit) ? hit : "https://" + hit);
    el.append(a);
    last = m.index + hit.length;
    re.lastIndex = last;
  }
  el.append(text.slice(last));
}
function openLightbox(src) {
  document.getElementById("lbImg").src = src;
  document.getElementById("lightbox").hidden = false;
}
function closeLightbox() {
  document.getElementById("lightbox").hidden = true;
  document.getElementById("lbImg").removeAttribute("src");
}
document.getElementById("lightbox").addEventListener("click", e => {
  if (e.target.id !== "lbImg") closeLightbox();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLightbox(); });  
let sentOnce = false;
function openContact() {
  const sel = document.getElementById("cf-cat");
  if (!sel.options.length) {
    Object.values(data.categories).forEach(c => sel.add(new Option(c.label, c.label)));
    sel.add(new Option("Andere / neue Kategorie", "Andere / neue Kategorie"));
  }
  if (sentOnce) {
    ["cf-name", "cf-note", "cf-coords"].forEach(id => document.getElementById(id).value = "");
    sentOnce = false;
  }
  document.getElementById("cf-err").textContent = "";
  document.getElementById("contact").hidden = false;
}
function closeContact() { document.getElementById("contact").hidden = true; }
function useHere() {
  const err = document.getElementById("cf-err");
  if (!navigator.geolocation) { err.textContent = "Standort wird auf diesem Gerät nicht unterstützt."; return; }
  err.textContent = "Standort wird ermittelt …";
  navigator.geolocation.getCurrentPosition(pos => {
    document.getElementById("cf-coords").value = pos.coords.latitude.toFixed(5) + ", " + pos.coords.longitude.toFixed(5);
    err.textContent = "";
  }, () => {
    err.textContent = "Standort nicht verfügbar. Bitte Koordinaten eintragen oder auf der Karte antippen.";
  }, { enableHighAccuracy: true, timeout: 10000 });
}
function pickOnMap() {
  const dlg = document.getElementById("contact");
  const hint = document.getElementById("pickHint");
  dlg.hidden = true;
  hint.hidden = false;
  const done = () => { hint.hidden = true; dlg.hidden = false; };
  const l = map.addListener("click", e => {
    l.remove();
    document.getElementById("cf-coords").value = e.latLng.lat().toFixed(5) + ", " + e.latLng.lng().toFixed(5);
    done();
  });
  document.getElementById("pickCancel").onclick = () => { l.remove(); done(); };
}
function sendContact() {
  const v = id => document.getElementById(id).value.trim();
  const err = document.getElementById("cf-err");
  const name = v("cf-name");
  const nums = (v("cf-coords").match(/-?\d+(?:[.,]\d+)?/g) || []).map(s => parseFloat(s.replace(",", ".")));
  if (!name) { err.textContent = "Bitte einen Namen für den Ort eintragen."; return; }
  if (nums.length !== 2 || Math.abs(nums[0]) > 90 || Math.abs(nums[1]) > 180) {
    err.textContent = "Bitte Koordinaten im Format 52.5069, 9.4631 eintragen oder auf der Karte antippen.";
    return;
  }
  const lat = +nums[0].toFixed(5), lng = +nums[1].toFixed(5);
  const note = v("cf-note"), cat = v("cf-cat"), from = v("cf-from");
  const body = [
    "Neuer Ort für die Beat the Street-Map", "",
    "Kategorie: " + cat,
    "Name: " + name,
    note ? "Adresse / Hinweise:\n" + note : null,
    "Koordinaten: " + lat + ", " + lng,
    "Karte: https://www.google.com/maps?q=" + lat + "," + lng,
    from ? "Von: " + from : null, "",
    "Zum Einfügen in die POI-Datei:",
    '{ "name": ' + JSON.stringify(name) + ', "lat": ' + lat + ', "lng": ' + lng + (note ? ', "note": ' + JSON.stringify(note) : "") + " }", "",
    "(Fotos bitte als Anhang an diese Mail hängen.)"
  ].filter(l => l !== null).join("\n");
  err.textContent = "";
  sentOnce = true;
  location.href = "mailto:" + CONTACT_EMAIL + "?subject=" + encodeURIComponent("Neuer Ort: " + name) + "&body=" + encodeURIComponent(body);
}
document.getElementById("cf-close").onclick = closeContact;
document.getElementById("cf-here").onclick = useHere;
document.getElementById("cf-pick").onclick = pickOnMap;
document.getElementById("cf-send").onclick = sendContact;
document.getElementById("contact").addEventListener("click", e => { if (e.target.id === "contact") closeContact(); });
async function initMap() {
  const { Map, InfoWindow } = await google.maps.importLibrary("maps");
  const { AdvancedMarkerElement, PinElement } = await google.maps.importLibrary("marker");

  map = new Map(document.getElementById("map"), {
    center: START, zoom: START_ZOOM, mapTypeId: "hybrid",
    mapId: "DEMO_MAP_ID",          // für eigene Kartenstile: eigene Map ID eintragen
    disableDefaultUI: true,
    zoomControl: false,
    gestureHandling: "greedy",
    clickableIcons: false
  });
  infoWindow = new InfoWindow({ headerDisabled: true });

  try {
  const res = await fetch("pois.json", { cache: "no-cache" });
  data = await res.json();
  data.pois = data.pois || [];
  await Promise.all(Object.entries(data.categories).map(async ([key, cat]) => {
    if (!cat.file) return;
    try {
      const r = await fetch(cat.file, { cache: "no-cache" });
      const list = await r.json();
      list.forEach(p => data.pois.push({ ...p, category: key }));
    } catch (e) {
      console.error("Datei fehlt oder ist ungültig:", cat.file);
    }
  }));
} catch (e) {
  showError("Die Datei <code>pois.json</code> konnte nicht geladen werden.");
  return;
}

  // Filter-Chips
  const bar = document.getElementById("filters");
  Object.entries(data.categories).forEach(([key, cat]) => {
    active.add(key);
    const b = document.createElement("button");
    b.className = "chip";
    b.style.setProperty("--c", cat.color);
    b.style.setProperty("--t", cat.textColor || "#fff");
    b.setAttribute("aria-pressed", "true");
    const ic = document.createElement("i");
if (/\.(svg|png)$/i.test(cat.icon || "")) {
  const img = document.createElement("img");
  img.src = cat.icon;
  ic.appendChild(img);
} else {
  ic.textContent = cat.icon || "📍";
}
b.append(ic, cat.label);
    b.onclick = () => {
      const on = !active.has(key);
      on ? active.add(key) : active.delete(key);
      b.setAttribute("aria-pressed", on);
      markers.forEach(m => { if (m.cat === key) m.el.map = on ? map : null; });
    };
    bar.appendChild(b);
  });

  // Marker
  const bounds = new google.maps.LatLngBounds();
  data.pois.forEach(p => {
    const cat = data.categories[p.category];
    if (!cat) return;
    const pin = document.createElement("div");
pin.style.cssText = `width:35px;height:35px;border-radius:50%;background:${cat.color};border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);display:grid;place-items:center;font-size:22px;line-height:1`;
if (/\.(svg|png)$/i.test(cat.icon || "")) {
  const img = document.createElement("img");
  img.src = cat.icon;
  img.style.cssText = "width:24px;height:24px";
  pin.appendChild(img);
} else {
  pin.textContent = cat.icon || "📍";
}
const el = new AdvancedMarkerElement({ map, position: { lat: p.lat, lng: p.lng }, title: p.name, content: pin });
    el.addListener("click", () => {
      const nav = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
      const box = document.createElement("div");
      box.className = "info";
      box.innerHTML = `<button class="x" aria-label="Schließen">×</button><h2></h2><div class="cat"></div><div class="note"></div><a class="route" target="_blank" rel="noopener">Route starten</a>`;
      box.querySelector("h2").textContent = p.name;
      box.querySelector(".cat").textContent = cat.label;
      linkify(box.querySelector(".note"), p.note || "");
      const imgs = [].concat(p.images || p.image || []).filter(Boolean);
      if (imgs.length) {
        const strip = document.createElement("div");
        strip.className = "photos";
        imgs.forEach(src => {
          const a = document.createElement("a");
          a.href = src;
          a.onclick = e => { e.preventDefault(); openLightbox(src); };
          a.target = "_blank";
          a.rel = "noopener";
          const img = document.createElement("img");
          img.alt = p.name;
          img.loading = "lazy";
          img.src = src;
          img.onerror = () => a.remove();
          a.appendChild(img);
          strip.appendChild(a);
        });
        box.insertBefore(strip, box.querySelector(".note"));
        if (imgs.length > 1) {
          const dots = document.createElement("div");
          dots.className = "dots";
          imgs.forEach((_, i) => {
            const d = document.createElement("i");
            if (i === 0) d.className = "on";
            dots.appendChild(d);
          });
          box.insertBefore(dots, box.querySelector(".note"));
          strip.addEventListener("scroll", () => {
            const i = Math.round(strip.scrollLeft / strip.clientWidth);
            [...dots.children].forEach((d, k) => d.classList.toggle("on", k === i));
          });
        }
      }
      box.querySelector(".x").onclick = () => infoWindow.close();
      box.querySelector("a.route").href = nav;
      infoWindow.setContent(box);
      infoWindow.open({ map, anchor: el });
    });
    markers.push({ el, cat: p.category });
    bounds.extend(el.position);
  });
//  if (markers.length > 1) map.fitBounds(bounds, { top: 90, right: 40, bottom: 40, left: 40 });

  document.getElementById("locate").onclick = toggleLocation;
  const rb = document.createElement("button");
rb.className = "chip refresh";
rb.setAttribute("aria-label", "Seite neu laden");
rb.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>';
rb.onclick = () => location.reload();
const cb = document.createElement("button");
cb.className = "chip";
cb.style.setProperty("--c", "#8a97a4");
const ci = document.createElement("i");
ci.textContent = "➕";
cb.append(ci, "Neuer Ort");
cb.onclick = openContact;
document.getElementById("filters").appendChild(cb);
document.getElementById("filters").appendChild(rb);
  google.maps.event.addListenerOnce(map, "idle", hideSplash);
}
window.initMap = initMap;

// Standort (nur solange die App geöffnet ist)
function toggleLocation() {
  const btn = document.getElementById("locate");
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
    if (meMarker) meMarker.map = null;
    btn.setAttribute("aria-pressed", "false");
    return;
  }
  if (!navigator.geolocation) return alert("Standort wird auf diesem Gerät nicht unterstützt.");
  let first = true;
  watchId = navigator.geolocation.watchPosition(pos => {
    const p = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    if (!meMarker) {
      const dot = document.createElement("div");
      dot.style.cssText = "width:18px;height:18px;border-radius:50%;background:#1f6feb;border:3px solid #fff;box-shadow:0 0 0 2px rgba(31,111,235,.4)";
      meMarker = new google.maps.marker.AdvancedMarkerElement({ position: p, content: dot, title: "Mein Standort", zIndex: 999 });
    }
    meMarker.position = p;
    meMarker.map = map;
    if (first) { map.panTo(p); first = false; }
    btn.setAttribute("aria-pressed", "true");
  }, () => {
    watchId = null;
    alert("Standort nicht verfügbar. Bitte in den iOS-Einstellungen für Safari bzw. die App erlauben.");
  }, { enableHighAccuracy: true });
}
</script>
