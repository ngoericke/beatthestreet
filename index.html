<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Beat the Street">
<meta name="theme-color" content="#14202b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Beat the Street</title>
<style>
  :root {
    --ink: #14202b;
    --paper: #f4f6f8;
    --line: #d5dce3;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { position: fixed; inset: 0; width: 100%; height: 100%; }

  .bar {
    position: fixed; left: 0; right: 0; top: 0; z-index: 5;
    padding: calc(var(--safe-top) + 10px) 12px 10px;
    background: var(--ink);
    display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
  }
  .bar::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 9px 14px; border-radius: 999px; border: 2px solid var(--c);
    background: transparent; color: #fff; font: 600 15px/1 inherit; font-family: inherit;
  }
  .chip i { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }
  .chip[aria-pressed="true"] { background: var(--c); }
  .chip[aria-pressed="true"] i { background: #fff; }
  .chip:focus-visible, .fab:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  .fab {
    position: fixed; right: 14px; bottom: calc(var(--safe-bottom) + 24px); z-index: 5;
    width: 52px; height: 52px; border-radius: 50%; border: 0;
    background: var(--ink); color: #fff; display: grid; place-items: center;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  .fab[aria-pressed="true"] { background: #1f6feb; }
  .fab svg { width: 26px; height: 26px; }

  .info { font: 15px/1.4 -apple-system, "Segoe UI", sans-serif; color: var(--ink); max-width: 230px; }
  .info h2 { margin: 0 0 2px; font-size: 17px; }
  .info .cat { color: #5b6a78; margin-bottom: 6px; }
  .info a {
    display: inline-block; margin-top: 8px; padding: 9px 14px; border-radius: 8px;
    background: var(--ink); color: #fff; text-decoration: none; font-weight: 600;
  }

  .msg {
    position: fixed; inset: 0; z-index: 10; display: none; place-items: center; padding: 24px;
    background: var(--ink); color: #fff; text-align: center; line-height: 1.5;
  }
  .msg.show { display: grid; }
  .msg code { background: #24323f; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>

<div id="map"></div>
<div class="bar" id="filters" role="group" aria-label="Kategorien"></div>

<button class="fab" id="locate" aria-pressed="false" aria-label="Meinen Standort anzeigen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
  </svg>
</button>

<div class="msg" id="error"><div id="errorText"></div></div>

<script>
/* ====== EINSTELLUNGEN ====== */
const API_KEY   = "AIzaSyDSYDkgKG_ki-3Ro9htJ-O0E4D2xaOcGNA";
const START     = { lat: 52.418326, lng: 9.435930 }; // Kartenmitte beim Start
const START_ZOOM = 13;
/* =========================== */

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

function showError(html) {
  document.getElementById("errorText").innerHTML = html;
  document.getElementById("error").classList.add("show");
}

// Google-Maps-Skript laden
(function load() {
  if (API_KEY === "DEIN_GOOGLE_MAPS_API_KEY") {
    showError("Bitte in <code>index.html</code> den Google-Maps-API-Key eintragen.");
    return;
  }
  const s = document.createElement("script");
  s.src = `https://maps.googleapis.com/maps/api/js?key=${API_KEY}&v=weekly&libraries=marker&loading=async&callback=initMap`;
  s.async = true;
  s.onerror = () => showError("Google Maps konnte nicht geladen werden.<br>Bitte Internetverbindung prüfen.");
  document.head.appendChild(s);
})();

let map, infoWindow, data, markers = [], active = new Set(), watchId = null, meMarker = null;

async function initMap() {
  const { Map, InfoWindow } = await google.maps.importLibrary("maps");
  const { AdvancedMarkerElement, PinElement } = await google.maps.importLibrary("marker");

  map = new Map(document.getElementById("map"), {
    center: START, zoom: START_ZOOM,
    mapId: "DEMO_MAP_ID",          // für eigene Kartenstile: eigene Map ID eintragen
    disableDefaultUI: true,
    zoomControl: false,
    gestureHandling: "greedy",
    clickableIcons: false
  });
  infoWindow = new InfoWindow();

  try {
    const res = await fetch("pois.json", { cache: "no-cache" });
    data = await res.json();
  } catch (e) {
    showError("Die Datei <code>pois.json</code> konnte nicht geladen werden.");
    return;
  }

  // Filter-Chips
  const bar = document.getElementById("filters");
  Object.entries(data.categories).forEach(([key, cat]) => {
    active.add(key);
    const b = document.createElement("button");
    b.className = "chip";
    b.style.setProperty("--c", cat.color);
    b.setAttribute("aria-pressed", "true");
    b.innerHTML = `<i></i>${cat.label}`;
    b.onclick = () => {
      const on = !active.has(key);
      on ? active.add(key) : active.delete(key);
      b.setAttribute("aria-pressed", on);
      markers.forEach(m => { if (m.cat === key) m.el.map = on ? map : null; });
    };
    bar.appendChild(b);
  });

  // Marker
  const bounds = new google.maps.LatLngBounds();
  data.pois.forEach(p => {
    const cat = data.categories[p.category];
    if (!cat) return;
    const pin = new PinElement({ background: cat.color, borderColor: "#fff", glyphColor: "#fff", scale: 1.15 });
    const el = new AdvancedMarkerElement({ map, position: { lat: p.lat, lng: p.lng }, title: p.name, content: pin.element });
    el.addListener("click", () => {
      const nav = `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`;
      const box = document.createElement("div");
      box.className = "info";
      box.innerHTML = `<h2></h2><div class="cat"></div><div class="note"></div><a target="_blank" rel="noopener">Route starten</a>`;
      box.querySelector("h2").textContent = p.name;
      box.querySelector(".cat").textContent = cat.label;
      box.querySelector(".note").textContent = p.note || "";
      box.querySelector("a").href = nav;
      infoWindow.setContent(box);
      infoWindow.open({ map, anchor: el });
    });
    markers.push({ el, cat: p.category });
    bounds.extend(el.position);
  });
  if (markers.length > 1) map.fitBounds(bounds, { top: 90, right: 40, bottom: 40, left: 40 });

  document.getElementById("locate").onclick = toggleLocation;
}
window.initMap = initMap;

// Standort (nur solange die App geöffnet ist)
function toggleLocation() {
  const btn = document.getElementById("locate");
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
    if (meMarker) meMarker.map = null;
    btn.setAttribute("aria-pressed", "false");
    return;
  }
  if (!navigator.geolocation) return alert("Standort wird auf diesem Gerät nicht unterstützt.");
  let first = true;
  watchId = navigator.geolocation.watchPosition(pos => {
    const p = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    if (!meMarker) {
      const dot = document.createElement("div");
      dot.style.cssText = "width:18px;height:18px;border-radius:50%;background:#1f6feb;border:3px solid #fff;box-shadow:0 0 0 2px rgba(31,111,235,.4)";
      meMarker = new google.maps.marker.AdvancedMarkerElement({ position: p, content: dot, title: "Mein Standort", zIndex: 999 });
    }
    meMarker.position = p;
    meMarker.map = map;
    if (first) { map.panTo(p); first = false; }
    btn.setAttribute("aria-pressed", "true");
  }, () => {
    watchId = null;
    alert("Standort nicht verfügbar. Bitte in den iOS-Einstellungen für Safari bzw. die App erlauben.");
  }, { enableHighAccuracy: true });
}
</script>
</body>
</html>
